name: Verificar

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Tipos, lint, pruebas (dominio y backend con convex-test) y build. No necesita secretos.
      # Con una URL de ejemplo el build es el real: sin ella, Vite elimina toda la app
      # del paquete (main.tsx lanza si falta VITE_CONVEX_URL) y el build pasaría igual.
      - run: npm run verify
        env:
          VITE_CONVEX_URL: https://ejemplo.convex.cloud
