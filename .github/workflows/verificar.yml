name: Verificar

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # URL local de prueba: permite incluir toda la app en el build, sin secretos.
      - run: npm run verify
        env:
          VITE_CONVEX_URL: http://127.0.0.1:3210
